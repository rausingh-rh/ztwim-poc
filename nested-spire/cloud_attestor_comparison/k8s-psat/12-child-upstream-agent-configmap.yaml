apiVersion: v1
data:
  agent.conf: |
    {
      "agent": {
        "data_dir": "/run/spire/data-upstream",
        "log_level": "debug",
        "server_address": "spire-server-grpc-zero-trust-workload-identity-manager.${TRUST_DOMAIN}",
        "server_port": "443",
        "socket_path": "/run/spire/upstream-agent/spire-agent.sock",
        "trust_bundle_path": "/run/spire/bundle/bundle.crt",
        "trust_domain": "${TRUST_DOMAIN}"
      },
      "health_checks": {
        "bind_address": "0.0.0.0",
        "bind_port": "9090",
        "listener_enabled": true,
        "live_path": "/live",
        "ready_path": "/ready"
      },
      "plugins": {
        "NodeAttestor": [{"k8s_psat": {"plugin_data": {
          "cluster": "child01",
          "token_path": "/var/run/secrets/tokens/spire-agent"
        }}}],
        "KeyManager": [{"disk": {"plugin_data": {"directory": "/run/spire/data-upstream"}}}],
        "WorkloadAttestor": [{"unix": {"plugin_data": {}}}]
      }
    }
kind: ConfigMap
metadata:
  annotations:
