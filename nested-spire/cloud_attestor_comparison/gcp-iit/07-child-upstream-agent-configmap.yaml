apiVersion: v1
data:
  agent.conf: |
    {
      "agent": {
        "data_dir": "/run/spire/agent-data",
        "log_level": "debug",
        "server_address": "spire-server-grpc.${TRUST_DOMAIN}",
        "server_port": "443",
        "socket_path": "/run/spire/upstream-agent/spire-agent.sock",
        "trust_bundle_path": "/run/spire/parent-trust-bundle/bundle.crt",
        "trust_domain": "${TRUST_DOMAIN}"
      },
      "plugins": {
        "KeyManager": [
          {
            "disk": {
              "plugin_data": {
                "directory": "/run/spire/agent-data"
              }
            }
          }
        ],
        "NodeAttestor": [
          {
            "gcp_iit": {
              "plugin_data": {}
            }
          }
        ],
        "WorkloadAttestor": [
          {
            "unix": {
              "plugin_data": {}
            }
          }
        ]
      },
      "telemetry": {
        "Prometheus": {
          "host": "0.0.0.0",
          "port": "9403"
        }
      }
    }
