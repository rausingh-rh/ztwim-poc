apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spire-server-grpc
  namespace: zero-trust-workload-identity-manager
spec:
  host: spire-server-grpc.${TRUST_DOMAIN}
  port:
    targetPort: grpc
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: spire-server
    weight: 100
  wildcardPolicy: None
